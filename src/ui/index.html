<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectNejko</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="browser-chrome">
    <!-- Tab Bar -->
    <div id="tab-bar">
      <div id="tabs-container">
        <!-- Dynamic tabs will be inserted here -->
      </div>
      <button id="btn-new-tab" title="New Tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <div class="window-drag-area"></div>
      <div class="brand-tag" title="ProjectNejko Browser">
        <span class="brand-name">ProjectNejko</span>
        <span class="brand-ver">Pre-Alpha V01.0.0</span>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div id="nav-bar">
      <div class="nav-buttons">
        <button id="btn-back" class="nav-btn" title="Back" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button id="btn-reload" class="nav-btn" title="Reload">
          <svg id="reload-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button id="btn-home" class="nav-btn" title="Home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
      </div>

      <!-- Address / Omnibox -->
      <div class="omnibox-container">
        <div class="omnibox-icon" id="security-badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <input 
          type="text" 
          id="address-bar" 
          placeholder="Search with Google or enter URL" 
          spellcheck="false"
          autocomplete="off"
        />
        <div id="loading-spinner" class="loading-spinner hidden"></div>
      </div>

      <div class="menu-buttons">
        <button id="btn-devtools" class="nav-btn" title="Developer Tools">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
