<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab - ProjectNejko</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1e2640, #0d111a);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .container {
      max-width: 760px;
      width: 100%;
      text-align: center;
    }
    .logo-container {
      margin-bottom: 24px;
    }
    .logo-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #6366f1, #3b82f6, #06b6d4);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.35);
      margin-bottom: 14px;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      letter-spacing: 0.5px;
      margin-bottom: 30px;
    }
    .search-box {
      position: relative;
      margin-bottom: 36px;
    }
    .search-input {
      width: 100%;
      padding: 16px 54px 16px 20px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-size: 1.05rem;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .search-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    .search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #6366f1;
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .search-btn:hover {
      background: #4f46e5;
    }
    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .quick-link-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 12px;
      text-decoration: none;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .quick-link-card:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
      color: #ffffff;
    }
    .quick-link-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      background: rgba(255, 255, 255, 0.08);
    }
    .quick-link-name {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .info-footer {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .info-footer span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo-icon">N</div>
      <h1>ProjectNejko</h1>
      <div class="badge">Pre-Alpha V01.0.0 • Chromium Powered</div>
    </div>

    <form class="search-box" id="searchForm">
      <input 
        type="text" 
        class="search-input" 
        id="searchInput" 
        placeholder="Search with Google or enter web address..." 
        autocomplete="off"
        autofocus
      />
      <button type="submit" class="search-btn" title="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>

    <div class="quick-links">
      <a href="https://www.google.com" class="quick-link-card">
        <div class="quick-link-icon">🔍</div>
        <span class="quick-link-name">Google</span>
      </a>
      <a href="https://www.youtube.com" class="quick-link-card">
        <div class="quick-link-icon">▶️</div>
        <span class="quick-link-name">YouTube</span>
      </a>
      <a href="https://github.com" class="quick-link-card">
        <div class="quick-link-icon">🐙</div>
        <span class="quick-link-name">GitHub</span>
      </a>
      <a href="https://wikipedia.org" class="quick-link-card">
        <div class="quick-link-icon">📖</div>
        <span class="quick-link-name">Wikipedia</span>
      </a>
      <a href="https://reddit.com" class="quick-link-card">
        <div class="quick-link-icon">💬</div>
        <span class="quick-link-name">Reddit</span>
      </a>
      <a href="https://duckduckgo.com" class="quick-link-card">
        <div class="quick-link-icon">🦆</div>
        <span class="quick-link-name">DuckDuckGo</span>
      </a>
    </div>

    <div class="info-footer">
      <span>🚀 ProjectNejko Browser (Pre-Alpha V01.0.0)</span>
      <span>⚡ Chromium Core (v152.0.7977.76)</span>
      <span>🛡️ Secure & Sandboxed</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      if (val.startsWith('http://') || val.startsWith('https://')) {
        window.location.href = val;
      } else if (val.includes('.') && !val.includes(' ')) {
        window.location.href = 'https://' + val;
      } else {
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
      }
    });
  </script>
</body>
</html>
